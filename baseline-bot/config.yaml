# Baseline trading bot configuration.
#
# Switch sandbox <-> live by pointing base_url at the right exchange and using
# the matching api_key. Treat sandbox as dev and live as prod: develop and test
# against sandbox, never against the live session.

exchange:
  base_url: "https://api.codetoimpact.sg"   # sandbox/live URL from the platform team
  api_key: REPLACE_WITH_TEAM_API_KEY

instruments:
  # Only NOVA and ELXR are traded by the baseline. AXON/CRVX/DRFT are left for
  # you to add (the strategy router already keys off this config).
  active:
    primary: "NOVA"
    secondary: "ELXR"

strategy:
  NOVA:
    type: momentum
    lookback_samples: 10
    momentum_threshold: 0.003
    trade_quantity: 100
    limit_offset_bps: 5
  ELXR:
    type: mean_reversion
    # lookback feels short — mean-reversion is throwing false signals. Check
    # James Wee's strategy notes before trusting this number.
    lookback_samples: 15
    deviation_threshold: 0.004
    trade_quantity: 50
    limit_offset_bps: 5

risk:
  # Every team starts each window with 1,000 shares per instrument, so a cap
  # below that refuses every buy. Caps are on the projected long (held +
  # pending buys), not on what the bot adds.
  max_position_primary: 1500
  max_position_secondary: 1500
  # Cap for the other discovered instruments (AXON/CRVX/DRFT), used by the
  # DCA overlay. 0 would block all buys on them.
  max_position_default: 1500
  # At most this many live orders per symbol; a persistent signal cannot stack.
  max_active_orders_per_symbol: 1
  # Order-rate anomaly throttle (BUG-003): more submits than this inside one
  # minute pauses new intents for anomaly_pause_seconds and is reported on
  # GET /status. Resting orders are left alone.
  max_orders_per_minute: 20
  anomaly_pause_seconds: 60
  # Stop-losses, the portfolio cap and behaviour-based sizing live under
  # `risk_model` below.

risk_model:
  # Instrument risk model (docs/risk-model-design.md). Sizes buys by each
  # instrument's personality, volatility regime and visible liquidity; cuts a
  # position that falls a volatility-scaled distance below its cost; blocks
  # buys at 15% portfolio drawdown; caps correlated and gross exposure. Sells
  # are never reduced. Everything below is a starting point to tune on the
  # sandbox; the calibration sample is recorded in the design doc.
  enabled: true
  size_mode: cap                 # cap: strategy quantity is the ceiling; target: the risk budget sets the size
  bucket_seconds: 10             # ticks are bucketed into 10 s bars before ATR (feed timing is irregular)
  atr_buckets: 14                # James p.3, M ~ 14
  regime_confirm_buckets: 3      # hysteresis: 3 bars (30 s) agree before a regime switch
  correlation_buckets: 30        # rolling 5-minute return correlation, display and alert only
  correlation_min_samples: 20
  correlation_alert: 0.7
  risk_per_trade_pct: 0.005      # equity at risk per buy if its stop fills (vol cap)
  max_notional_per_symbol_pct: 0.35
  max_gross_exposure_pct: 0.90
  instrument_loss_limit_pct: 0.02   # per-symbol session loss that pauses its buys
  drawdown:
    warn_pct: 0.10               # alert
    limit_pct: 0.15              # Priya: 15% of starting capital
    action: block_buys           # alert_only | block_buys | halt
  stop_loss:
    enabled: true                # set false to keep sizing/caps but no cost-basis stops
  exit:
    floor_pct: 0.03              # a stop sells into the bids, never below 3% under the trigger
    reprice_after_seconds: 5
  regime_factors:                # size factor by strategy type and regime (James p.3)
    momentum:       {LOW: 0.0, NEUTRAL: 0.5, HIGH: 1.0}
    mean_reversion: {LOW: 1.0, NEUTRAL: 0.75, HIGH: 0.5}
    dca:            {LOW: 1.0, NEUTRAL: 1.0, HIGH: 0.5}
  groups:
    # Freight follows energy costs (brief, Derek, James p.4): long both is one
    # position, so the pair shares a cap (Clarissa, Farrukh, BUG-008).
    energy_freight: {members: [NOVA, AXON], max_exposure_pct: 0.45}
  default_profile:               # any instrument discovered without a profile
    personality: unknown
    size_multiplier: 0.5
    liquidity: liquid
    depth_fraction: 0.5          # max share of the visible top-5 ask depth per buy
    max_qty_without_book: 1000   # ceiling before the first book_update arrives
    low_vol: 0.004               # 10 s ATR% below -> LOW (momentum off)
    high_vol: 0.010              # above -> HIGH (full size); sandbox liquid names run ~0.8-1.0%
    stop_atr_mult: 4.0           # stop distance = 4 x ATR ...
    min_stop_pct: 0.05           # ... but never tighter than 5% of cost (sandbox swings 3-5% per 2 min)
    max_stop_pct: 0.12           # ... nor wider than 12%; the crash guard sits at 15%
    confirm_ticks: 3
    cooldown_seconds: 120
  profiles:
    NOVA: {personality: trending, size_multiplier: 1.0}
    AXON: {personality: follower, size_multiplier: 0.75, max_stop_pct: 0.10}
    CRVX: {personality: growth_momentum, size_multiplier: 0.75}
    # Thin book: a fifth of NOVA (Priya), a fifth of the visible asks, wider
    # regime bands because a thin name looks volatile per sample (James p.3).
    DRFT: {personality: thin_event, size_multiplier: 0.2, liquidity: thin,
           depth_fraction: 0.2, max_qty_without_book: 20,
           low_vol: 0.006, high_vol: 0.015, min_stop_pct: 0.06, max_stop_pct: 0.15}
    # Range-bound: lowest volatility on the sandbox (10 s ATR ~0.5%), so its
    # own bands and the tightest stop floor.
    ELXR: {personality: range_bound, size_multiplier: 1.0,
           low_vol: 0.003, high_vol: 0.007, min_stop_pct: 0.04, max_stop_pct: 0.10}

rate_limits:
  # Exchange tiers, per team, rolling window (exchange-api-reference §Rate limits).
  window_seconds: 30
  orders_per_window: 100
  shared_per_window: 300
  shared_reserve: 40          # slots held back for cancels and 504 reconciliation

heartbeat:
  # Liveness for the dashboard (emit every ~5 s; the dashboard shows DEAD after
  # 15 s without one) and the feed-stall watchdog thresholds, in seconds since
  # the last SSE event. Above feed_stall_after_seconds the stream is restarted
  # from its Last-Event-ID cursor.
  interval_seconds: 5
  feed_degraded_after_seconds: 10
  feed_stall_after_seconds: 20

control:
  # Local kill-switch endpoint consumed by the dashboard (via its /bot/* proxy).
  # Binds to localhost only; POST /halt runs the same path as Ctrl-C.
  host: "127.0.0.1"
  port: 8092

crash_guard:
  # Crash exit, applied to EVERY discovered instrument (all five start with a
  # 1,000-share position, not just the two the strategies trade).
  # When the last price sits `drop_pct` below the window high for
  # `confirm_ticks` consecutive ticks, cancel our resting orders on that symbol
  # and sell the whole position in ONE limit order priced at the bid level that
  # absorbs it (price-time priority fills it against every better bid first).
  # The sell price never goes below `floor_pct` under the trigger price; any
  # remainder rests there and is repriced once after `reprice_after_seconds`.
  # Strategies stay quiet on that symbol for `cooldown_seconds`.
  enabled: true
  drop_pct: 0.15
  confirm_ticks: 3
  floor_pct: 0.03
  cooldown_seconds: 300
  reprice_after_seconds: 5

dca:
  # Dollar-cost averaging overlay: every `interval_seconds`, buy
  # `cash_per_buy_cents` worth of EACH discovered instrument at the last price
  # (plus `limit_offset_bps` to cross the spread). Runs beside the strategies;
  # the OrderManager's position cap, cash check and one-order-per-symbol slot
  # still apply. A refused buy (slot busy, cap reached) is retried after
  # `retry_seconds`. Skipped while a symbol is in crash-guard cooldown.
  enabled: true
  interval_seconds: 60
  cash_per_buy_cents: 500000     # S$5,000 per instrument per interval
  retry_seconds: 5
  limit_offset_bps: 5
