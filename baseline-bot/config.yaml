# Baseline trading bot configuration.
#
# Switch sandbox <-> live by pointing base_url at the right exchange and using
# the matching api_key. Treat sandbox as dev and live as prod: develop and test
# against sandbox, never against the live session.
#
# STRATEGY ASSIGNMENTS come from the pre-read, not from taste:
#
#   NOVA  Oil & Gas, trending, event-sensitive   -> momentum, WIDE lookback
#         "it moves slow and far" (Derek Tan); James p.1 "trending names ...
#         use a wider lookback than the fast names".
#   AXON  Logistics, correlated with NOVA        -> leader-follower off NOVA
#         "energy costs drive freight, so use NOVA as a leading signal: NOVA
#         breaks a new high, go long AXON" (Derek); James p.4.
#   CRVX  Semiconductors, growth                 -> momentum, narrower lookback
#         "behaves like a growth/momentum name" (James p.4). Faster than NOVA,
#         so a tighter window than NOVA's by the same page-1 rule.
#   ELXR  Pharma, defensive, range-bound         -> mean-reversion, lookback 15
#         "Lookback = 15 samples. This is important ... Use 15." (James p.2,
#         and Adeline Loh's top bug).
#   DRFT  Defense, event-driven, THIN book       -> mean-reversion, tiny size
#         "moves on announcements, not on the others -- handle separately and
#         size it small, your own orders move its price" (James p.4). Momentum
#         is the wrong shape here: on a book this thin the bot's own buys lift
#         the last price, which momentum then reads as its own signal.

exchange:
  base_url: "https://api.codetoimpact.sg"   # sandbox/live URL from the platform team
  api_key: "REPLACE_WITH_TEAM_API_KEY"     # never commit the real key; set EXCHANGE_API_KEY

instruments:
  active:
    primary: "NOVA"
    secondary: "ELXR"
    extra:
      - "CRVX"
      - "DRFT"
      - "AXON"

strategy:
  NOVA:
    type: momentum
    # Momentum is (last - first) / first over the window, so a wider window
    # measures a larger change for the same trend. Holding the required SLOPE
    # constant when widening 10 -> 25: 0.008/10 = 0.0008 per sample, x25 = 0.02.
    # Same selectivity per unit of trend, better noise rejection (noise grows
    # with sqrt(N), trend with N).
    lookback_samples: 25
    momentum_threshold: 0.012
    trade_quantity: 400
    limit_offset_bps: 5
  ELXR:
    type: mean_reversion
    lookback_samples: 15
    deviation_threshold: 0.004
    trend_guard: 0.003
    trade_quantity: 800
    limit_offset_bps: 5
  CRVX:
    type: momentum
    # Growth name: moves faster than NOVA, so a narrower window. Slope-preserved
    # from the previous 0.005/10: 0.0005 per sample x15 = 0.0075.
    lookback_samples: 15
    momentum_threshold: 0.0075
    trade_quantity: 600
    limit_offset_bps: 5
  DRFT:
    type: mean_reversion
    # "It spikes on volume then drops" (Ethan, junior trader) — a spike-and-
    # revert profile, so buy the trough and sell into the spike.
    #
    # ASYMMETRIC BANDS, and they have to be. A single 0.015 band placed NOTHING
    # here, measured: the moves are upward, so price rarely sits 1.5% *below*
    # its own mean, the buy leg never fired, and long-only means the sell leg
    # cannot fire without a prior buy. 0 buys -> no position -> 0 sells.
    #
    # Buy the small frequent dips, sell into the large rare spikes. The sell
    # band stays wider than the buy band so a position is only released on a
    # real spike, not on noise.
    lookback_samples: 15
    deviation_threshold: 0.006      # fallback for either side if unset
    buy_deviation_threshold: 0.006
    sell_deviation_threshold: 0.012
    trade_quantity: 10
    limit_offset_bps: 5
  # --- crash_buy (strategies/crash_buy.py) — NOT YET ASSIGNED ---------------
  # Scales aggressively into a sharp sell-off and sells the rebound. Built for
  # the 13:42-type event (CRVX -17% in one candle, then a clean V-recovery).
  # To try it, replace a liquid instrument's block with this one and set a
  # stop_loss_pct for it under risk.exits — the strategy places no stop itself.
  # NEVER on DRFT: on a thin book our own ladder would be the "rebound".
  #
  # CRVX:
  #   type: crash_buy
  #   lookback_samples: 30        # window whose high is the pre-crash reference
  #   crash_drop_pct: 0.06        # 6% off the window high opens an episode
  #   tranche_step_pct: 0.03      # tranche k needs a drop of k * 3%
  #   tranche_scale: 1.5          # each tranche 1.5x the previous
  #   max_tranches: 3             # 600 + 900 + 1350 = 2850 shares max per episode
  #   confirm_samples: 2          # wait 2 prints without a new low before buying
  #   recovery_fraction: 0.6      # sell once 60% of the gap to the reference is back
  #   abandon_drop_pct: 0.25      # past -25% it is a repricing, not a dip: stop adding
  #   trade_quantity: 600
  #   sell_quantity: 1000         # unwind in bigger clips than we entered
  #   limit_offset_bps: 5
  #
  # Check max_position for the symbol covers the full ladder, and the
  # correlated_groups notional if the symbol is in one.

  AXON:
    type: pairs_follow
    leader: "NOVA"
    # Long-only, so this is a correlated long, not a hedged pair: it stacks on
    # NOVA's exposure instead of offsetting it.
    lookback_samples: 5          # own buffer: only supplies the limit reference
    leader_breakout_samples: 10  # must be <= NOVA's lookback_samples
    breakout_arm_samples: 10     # follow for this many of our own ticks
    exit_drawdown: 0.012         # leader gives back 1.2% from its high -> close
    trade_quantity: 400
    limit_offset_bps: 5

# Regime-aware sizing (James Wee, page 3 — "this is the one that matters").
#
# CLASSIFICATION is a separate component: point `classifier` at a dotted path to
# something implementing strategies.regime_policy.RegimeClassifier (observe + classify,
# returning one of TREND / RANGE / COMPRESSION / SHOCK / NEUTRAL / WARMUP).
# Hysteresis — page 3's "so it doesn't flip-flop on the boundary" — belongs
# there: debouncing a label is a property of the labeller, not of this table.
# Per-instrument thresholds likewise.
#
# POLICY is here: a multiplier in [0, 1] applied to a new BUY. It can only
# reduce risk. A sell is never touched, because a market-state label must not be
# able to trap us in a position. Above 1.0 is rejected at startup.
#
# Enabling this without a classifier raises at startup rather than defaulting:
# every symbol would read WARMUP, WARMUP forbids entries, and the bot would stop
# trading without saying why.
regime:
  enabled: false
  classifier: "strategies.regime_adapter.AtrRegimeClassifier"
  # static_regime: "TREND"       # pin one regime for a demo or a bisect

  # Omitted (family, regime) pairs fall back to strategies.regime_policy.DEFAULT_POLICY,
  # which is these values. Restated here so the table is visible to the desk.
  policy:
    momentum:
      TREND: 1.0                 # momentum active
      RANGE: 0.0                 # p.3: "suspend momentum (it will bleed)"
      COMPRESSION: 0.25          # no trend to ride — cut size toward zero
      SHOCK: 0.0                 # whipsaw risk; no new entries
      NEUTRAL: 0.5               # p.3: "hold current posture, reduce size"
      WARMUP: 0.0                # never trade on an unclassified regime
    mean_reversion:
      TREND: 0.0                 # reverting into a trend is the falling knife
      RANGE: 1.0                 # the range is where reversion belongs
      COMPRESSION: 0.5           # little deviation worth capturing
      SHOCK: 0.0                 # the move is information, not noise
      NEUTRAL: 0.5
      WARMUP: 0.0
    crash_buy:
      # The one family that wants a SHOCK — the shock is its entry. TREND is
      # halved not zeroed: the label is direction-blind here, and a dip in an
      # uptrend is the good case.
      TREND: 0.5
      RANGE: 1.0
      COMPRESSION: 0.5
      SHOCK: 1.0
      NEUTRAL: 1.0
      WARMUP: 0.0
    pairs_follow:
      # A follower reads its LEADER's regime: AXON's entry is triggered by NOVA
      # breaking out, so whether that breakout means anything is a question
      # about NOVA. The multipliers mirror momentum's — a breakout signal is a
      # momentum signal wearing another instrument.
      TREND: 1.0
      RANGE: 0.0
      COMPRESSION: 0.25
      SHOCK: 0.0
      NEUTRAL: 0.5
      WARMUP: 0.0

  # Per-instrument overrides of the family table, for the case page 3 flags:
  # "the thin name will look more volatile per sample even when nothing is
  # happening, so don't share thresholds across instruments."
  per_symbol:
    DRFT:
      # Reduced, not zeroed. These were 0.0 when DRFT was effectively inert;
      # now that it trades, zeroing COMPRESSION and NEUTRAL would suppress it
      # in exactly the quiet conditions between spikes where it accumulates
      # its position cheaply. The tiny clip, the 100-share cap and the 2% stop
      # are what make that safe — not refusing to trade.
      COMPRESSION: 0.25
      NEUTRAL: 0.25
      SHOCK: 0.0                 # a thin book in a shock is the one to avoid

risk:
  # --- position caps ------------------------------------------------------
  # Not cash-binding: all caps filled at once is ~2100 shares, and at $60-$300
  # that is well under the $10M a window opens with. They are concentration
  # limits, so they are sized by conviction and by how much damage the name can
  # do. Winston: prioritise NOVA and ELXR for stability; "AXON and CRVX are
  # enhancements". Enhancements therefore do not get bigger books than the
  # primary.
  max_position_primary: 4000     # NOVA
  max_position_secondary: 3000   # ELXR
  max_position:
    CRVX: 3500                   # enhancement, momentum
    AXON: 4000                   # follower, matches leader's cap
    DRFT: 400                    # thin book — kept small relative to others

  order_cooldown_seconds: 3.0    # min seconds between orders for the same symbol

  # --- correlated groups (BUG-008) ----------------------------------------
  # Per-instrument caps can all be satisfied while the book is one directional
  # bet. Clarissa Ng: "NOVA and AXON move together; if we're long both we've
  # doubled a position." AXON's strategy makes that literal — it follows NOVA's
  # breakout and the exchange is long-only, so it stacks on NOVA instead of
  # hedging it.
  #
  # Capped in NOTIONAL CENTS, not shares: a share count cannot express joint
  # exposure across instruments at different prices. Measured against each
  # member's projected position (pending orders included) at its live mark.
  #
  # Sizing: NOVA 500 + AXON 500 shares, at the $60-$300 range instruments open
  # in, is $60,000-$300,000 of one theme. 15,000,000 cents ($150,000) binds in
  # the upper half of that range and leaves the lower half to the per-symbol
  # caps. Re-check against actual opening prices on sandbox.
  correlated_groups:
    energy_freight:
      symbols: ["NOVA", "AXON"]
      max_notional_cents: 120000000

  # --- exits --------------------------------------------------------------
  # Fractions of the cost basis the exchange reports in
  # GET /portfolio -> positions[].avg_cost. Every leg is a SELL that reduces or
  # closes a held long; the exchange is long-only, so there is no protective
  # stop on a short. Checked on every price event, and they OVERRIDE the
  # strategy signal rather than competing with it.
  #
  # Which take-profit suits a name depends on its strategy:
  #
  #   momentum / follower -> TRAILING. A fixed target caps exactly the upside
  #     momentum exists to capture. A trail lets the winner run and exits once
  #     it gives back trail_pct from its high-water mark. It also closes a real
  #     gap: momentum's own exit needs the whole window return to turn negative,
  #     which on a 25-sample window means handing back most of the move first.
  #
  #   spike-and-revert (DRFT) -> FIXED. A trail sells into the drop on a thin
  #     book; take the spike at a level instead.
  #
  #   mean-reversion (ELXR) -> NONE. Selling when price runs above the mean is
  #     already that strategy's exit, so a fixed level would only fight it.
  #
  # A symbol omitted here has no exits at all, deliberately: nothing should
  # guess at a risk tolerance nobody set. Tune on sandbox — these are starting
  # points, not measured values.
  exits:
    NOVA:
      stop_loss_pct: 0.03        # trending, moves slow and far — wide stop
      trailing_take_profit:
        arm_pct: 0.04            # only trail once up 4% from cost
        trail_pct: 0.015         # then exit on a 1.5% give-back from the peak
    CRVX:
      stop_loss_pct: 0.04        # growth name, widest of the liquid names
      trailing_take_profit:
        arm_pct: 0.05
        trail_pct: 0.02
    AXON:
      stop_loss_pct: 0.03        # follows NOVA, so tracks NOVA's levels
      trailing_take_profit:
        arm_pct: 0.04
        trail_pct: 0.015
    ELXR:
      stop_loss_pct: 0.03        # widened — 1.5% was causing repeated stop-outs
    DRFT:
      stop_loss_pct: 0.02        # thin book — exit before the spread eats it
      take_profit_pct: 0.04      # spikes then drops: take the spike
  # An exit concedes more of the spread than a strategy order — getting out
  # beats the last basis point of price.
  exit_limit_offset_bps: 25

orderbook:
  stale_threshold_seconds: 5

  # --- spread filter (how WIDE the book is) -------------------------------
  # Refuses an ENTRY when the touch is wider than this. Exits are never gated:
  # a wide book is exactly when you most want out.
  max_spread_bps:
    NOVA: 50
    ELXR: 50
    CRVX: 50
    DRFT: 100                    # thin by nature — a tighter cap never trades
    AXON: 50

  # --- liquidity filter (how DEEP the book is) ---------------------------
  # Different question from the spread. Adeline Loh: "If we're getting lots of
  # partial fills on NOVA, our sizing is too big for the book." So the entry
  # clip is SHRUNK to the shares actually resting at or better than our limit,
  # rather than sent at full size and partially filled.
  #
  # Depth excludes our own resting orders — an order crossing one comes back
  # 409 SELF_MATCH, so our own size is not liquidity we can take.
  #
  # `min_depth_shares` is the floor below which an entry is not worth asking
  # for at all: a 2-share fill on NOVA moves the price and tells us nothing.
  # Roughly a fifth of each clip. Omit a symbol to disable its floor (it will
  # still be sized down to available depth).
  min_depth_shares:
    NOVA: 10                     # clip 50
    ELXR: 20                     # clip 100
    CRVX: 20                     # clip 100
    DRFT: 5                      # clip 10 — thin book, so a low bar
    AXON: 10                     # clip 50

news:
  enabled: true
  cooldown_seconds: 60
  directive_ttl_seconds: 120
  default_size_multiplier: 0.5
  size_multiplier:
    NOVA: 0.6
    ELXR: 0.5
    CRVX: 0.8
    DRFT: 0.25
    AXON: 0.6

  # --- LLM sentiment analysis (S1) ----------------------------------------
  # Two tiers. The keyword classifier above is tier 0: coarse but instant, and
  # it has to be, because the event worker is a single thread and an LLM round
  # trip takes seconds. This is tier 1 — it runs on its own thread and replaces
  # the provisional bias with per-symbol views that reason across the supply
  # chain, which is what Sophia Tan actually asked for: "I don't want a keyword
  # match on the named ticker ... sanctions on freight hit AXON directly but
  # ripple to NOVA and CRVX for different reasons."
  #
  # Authentication is the SAME secret as the exchange — the LLM service has no
  # separate key — so it comes from EXCHANGE_API_KEY and is never written here.
  #
  # Budget: the grant is ~$25 USD and a top-up is recorded and may carry a
  # scoring penalty. One call per announcement_id, memoised, plus the hard
  # ceiling below. At roughly $0.003 a call on sonnet, 60 calls is under $0.20.
  llm:
    enabled: true
    base_url: "https://llm.codetoimpact.sg"
    # The service's own reference names sonnet the default and asks for the
    # smallest model that does the job. The task is a short supply-chain
    # inference at single-digit calls per window, so cost is not binding and
    # sonnet is the sensible middle. "haiku" is cheaper, "opus" reasons harder.
    model: "sonnet"
    max_tokens: 1024
    timeout_seconds: 20
    # Views below this confidence are discarded rather than traded. A
    # second-order ripple should score lower than a direct hit, so this is the
    # line between "act on it" and "note it".
    min_confidence: 0.6
    max_calls_per_session: 60

control:
  # Local kill-switch endpoint consumed by the dashboard (via its /bot/* proxy).
  # Binds to localhost only; POST /halt runs the same path as Ctrl-C.
  host: "127.0.0.1"
  port: 8092
