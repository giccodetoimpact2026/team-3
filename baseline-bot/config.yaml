# Baseline trading bot configuration.
#
# Switch sandbox <-> live by pointing base_url at the right exchange and using
# the matching api_key. Treat sandbox as dev and live as prod: develop and test
# against sandbox, never against the live session.

exchange:
  base_url: "https://api.codetoimpact.sg"   # sandbox/live URL from the platform team
  api_key: "REPLACE_WITH_TEAM_API_KEY"

instruments:
  active:
    primary: "NOVA"
    secondary: "ELXR"
    extra:
      - "CRVX"
      - "DRFT"
      - "AXON"

strategy:
  NOVA:
    type: momentum
    lookback_samples: 10
    momentum_threshold: 0.008
    trade_quantity: 50
    limit_offset_bps: 5
  ELXR:
    type: mean_reversion
    lookback_samples: 15
    deviation_threshold: 0.004
    trade_quantity: 100
    limit_offset_bps: 5
  CRVX:
    type: momentum
    lookback_samples: 10
    momentum_threshold: 0.005
    trade_quantity: 200
    limit_offset_bps: 5
  DRFT:
    type: momentum
    lookback_samples: 10
    momentum_threshold: 0.005
    trade_quantity: 200
    limit_offset_bps: 5
  AXON:
    type: mean_reversion
    lookback_samples: 15
    deviation_threshold: 0.004
    trade_quantity: 100
    limit_offset_bps: 5

risk:
  max_position_primary: 500
  max_position_secondary: 400
  max_position:
    CRVX: 1500
    DRFT: 1500
    AXON: 2000

control:
  # Local kill-switch endpoint consumed by the dashboard (via its /bot/* proxy).
  # Binds to localhost only; POST /halt runs the same path as Ctrl-C.
  host: "127.0.0.1"
  port: 8092
