name: Bot checks
on: [push, pull_request]
jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baseline-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.16.8
      - run: ruff check .
      - run: pytest -q
