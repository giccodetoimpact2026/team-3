<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIC Trading Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="assets/gic-logo-placeholder.svg" alt="GIC" class="logo" />
        <span class="title">Trading Dashboard</span>
      </div>
      <div class="status">
        <span id="connectivity-dot" class="dot offline"></span>
        <span id="connectivity-label">CONNECTING…</span>
      </div>
    </header>

    <main class="content">
      <section class="cards">
        <div class="card" id="card-total-value">
          <div class="label">Total Value</div>
          <div class="value">—</div>
        </div>
        <div class="card" id="card-realized-pnl">
          <div class="label">Realized P&amp;L</div>
          <div class="value">—</div>
        </div>
        <div class="card" id="card-unrealized-pnl">
          <div class="label">Unrealized P&amp;L</div>
          <div class="value">—</div>
        </div>
      </section>

      <section class="positions">
        <h2>Positions</h2>
        <table>
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Quantity</th>
              <th>Avg Cost</th>
              <th>Market Value</th>
              <th>Unrealized P&amp;L</th>
            </tr>
          </thead>
          <tbody id="positions-body"></tbody>
        </table>
      </section>

      <!--
        M4 — conversational panel (student build). Uncomment and wire an LLM
        around the provided MCP read tools. mcp-adapter.example.js gives one
        working call (callTool) to copy; render the answer WITH the tool's
        `source` citation and a confidence indicator.

        <section id="assistant-panel">
          <h2>Assistant</h2>
          ... input + answer area; see mcp-adapter.example.js ...
        </section>
      -->

      <!--
        S2 — predictive view (student build). One forward-looking output with an
        explicit confidence band, labelled as a model estimate.

        <section id="forecast-panel"></section>
      -->

      <!--
        Price chart (student build). No candles endpoint exists — build history
        from the SSE `price` events (a circular buffer per symbol).

        <canvas id="price-chart" width="900" height="280"></canvas>
      -->
    </main>

    <footer class="footer">
      <span id="last-updated">Last updated: —</span>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/format.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
