# Starter CI for the baseline dashboard — syntax check + unit tests on push/PR.
# No external dependencies (uses Node's built-in test runner). Extend it as you
# add tooling (ESLint, a headless-browser smoke test, etc.).
#
# NOTE: this lives inside the baseline-dashboard project. It runs once this
# project is in its own repository (GitHub only picks up workflows under the
# repo-root .github/workflows/).
name: dashboard-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
